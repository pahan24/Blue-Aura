    +'<div style="background:#fff;border-radius:14px;border:1.5px solid #fee2e2;padding:26px;margin-bottom:20px">'
    +'<div style="font-size:15px;font-weight:700;color:var(--red);margin-bottom:16px">&#9888;&#65039; Account Actions</div>'
    +'<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gl);gap:12px;flex-wrap:wrap"><div><div style="font-size:14px;font-weight:500">Clear Local Data</div><div style="font-size:12px;color:var(--g)">Clear cart, wishlist, and cached data</div></div><button id="clear-data-btn" class="ba-btn ba-btn-sm" style="background:#fee2e2;color:#e53e3e;border:1px solid #fca5a5">Clear</button></div>'
    +'<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:12px;flex-wrap:wrap"><div><div style="font-size:14px;font-weight:500">Sign Out</div><div style="font-size:12px;color:var(--g)">Sign out from this device</div></div><button id="so-settings-btn" class="ba-btn ba-btn-sm" style="background:var(--red);color:#fff;border:none">Sign Out</button></div>'
    +'</div>'

    +'</div></div>';

  setTimeout(function(){
    /* Dark mode toggle */
    var tsw=document.getElementById('theme-sw');
    if(tsw) tsw.addEventListener('click',function(){
      var cur=document.body.getAttribute('data-theme')||'light';
      var nxt=cur==='dark'?'light':'dark';
      document.body.setAttribute('data-theme',nxt);
      localStorage.setItem('ba_theme',nxt);
      this.style.background=nxt==='dark'?'#0A0A0A':'#ddd';
      var th=document.getElementById('theme-sw-thumb'); if(th)th.style.left=nxt==='dark'?'24px':'4px';
      var dt=document.getElementById('dark-toggle'); if(dt)dt.textContent=nxt==='dark'?'&#9728;&#65039;':'&#127769;';
    });

    /* Notification switches */
    document.querySelectorAll('.notif-sw').forEach(function(sw){
      sw.addEventListener('click',function(){
        var nid=this.dataset.nid;
        var cur=localStorage.getItem('ba4_'+nid)!=='0';
        var nxt=!cur;
        localStorage.setItem('ba4_'+nid,nxt?'1':'0');
        this.style.background=nxt?'#0A0A0A':'#ddd';
        var th=this.querySelector('div'); if(th)th.style.left=nxt?'24px':'4px';
      });
    });

    /* Save account */
    var sab=document.getElementById('save-acct-btn');
    if(sab) sab.addEventListener('click',function(){
      var user=State.user; if(!user)return;
      user.name=document.getElementById('st-name').value||user.name;
      if(!FB_USER) user.email=document.getElementById('st-em').value||user.email;
      State.user=user; updateUserUI();
      if(FB_USER) FB_USER.updateProfile({displayName:user.name}).catch(function(){});
      if(DB&&FB_USER) dbSet('users',FB_USER.uid,{name:user.name,updatedAt:new Date().toISOString()});
      toast('Settings saved! ✓');
    });

    /* Password update */
    var spb=document.getElementById('save-pw-btn');
    if(spb) spb.addEventListener('click',function(){
      var np=document.getElementById('pw-new')?document.getElementById('pw-new').value:'';
      var cp=document.getElementById('pw-conf')?document.getElementById('pw-conf').value:'';
      if(!np||np.length<8){toast('Password must be at least 8 characters','error');return;}
      if(np!==cp){toast('Passwords do not match','error');return;}
      if(FB_USER){
        FB_USER.updatePassword(np).then(function(){toast('Password updated! ✓');document.getElementById('pw-new').value='';document.getElementById('pw-conf').value='';}).catch(function(e){
          if(e.code==='auth/requires-recent-login'){toast('Please sign out and sign in again before changing your password','error');}
          else toast('Error: '+e.message,'error');
        });
      } else toast('Password updated (demo)! ✓');
    });

    /* Loyalty */
    var glb=document.getElementById('go-loyalty-btn'); if(glb) glb.addEventListener('click',function(){navTo('loyalty');});

    /* Clear data */
    var cdb=document.getElementById('clear-data-btn');
    if(cdb) cdb.addEventListener('click',function(){
      if(!confirm('Clear all local data? Your cart and wishlist will be emptied on this device.'))return;
      ['ba_cart','ba_wish','ba_orders'].forEach(function(k){localStorage.removeItem(k);});
      toast('Local data cleared');
      setTimeout(function(){navTo('home');},600);
    });

    /* Sign out */
    var sob=document.getElementById('so-settings-btn');
    if(sob) sob.addEventListener('click',function(){
      if(FB_AUTH) FB_AUTH.signOut().then(function(){FB_USER=null;logout();navTo('home');toast('Signed out');}).catch(function(){logout();navTo('home');});
      else{logout();navTo('home');toast('Signed out');}
    });
  },50);
}

/* ── CART SIDEBAR (replaces mini cart) ── */
function openCart(){
  var existing=document.getElementById('ba-cart-sidebar');
  if(existing){existing.remove();document.body.style.overflow='';return;}
  var items=State.cart;
  var sub=cartSubtotal();
  var ship=cartShipping(0);

  var sidebar=document.createElement('div');
  sidebar.id='ba-cart-sidebar';
  sidebar.style.cssText='position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:#fff;z-index:900;box-shadow:-8px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;';

  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:899;';
  overlay.id='cart-overlay';

  function closeCart(){
    var s=document.getElementById('ba-cart-sidebar'),o=document.getElementById('cart-overlay');
    if(s)s.remove();if(o)o.remove();
    document.body.style.overflow='';
  }

  sidebar.innerHTML=
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid #eee;flex-shrink:0">'
    +'<div style="font-size:18px;font-weight:600">My Bag <span style="font-size:13px;color:#888;font-weight:400">('+items.reduce(function(s,x){return s+x.qty;},0)+' items)</span></div>'
    +'<button id="close-cart-btn" style="background:none;border:none;cursor:pointer;font-size:28px;color:#888;padding:4px;line-height:1">&#215;</button>'
    +'</div>'
    +'<div style="flex:1;overflow-y:auto;padding:16px 22px">'
    +(items.length===0
      ? '<div style="text-align:center;padding:60px 20px;color:#888"><div style="font-size:52px;margin-bottom:14px;opacity:.3">&#128717;</div><div style="font-size:15px;font-weight:500;margin-bottom:6px">Your bag is empty</div><p style="font-size:13px">Add some items to get started!</p></div>'
      : items.map(function(item){
          return '<div style="display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #f0f0f0">'
            +'<div style="width:72px;height:90px;flex-shrink:0;border-radius:8px;overflow:hidden"><img src="'+item.img+'" style="width:100%;height:100%;object-fit:cover"></div>'
            +'<div style="flex:1;min-width:0">'
            +'<div style="font-size:13px;font-weight:600;margin-bottom:3px;line-height:1.35">'+item.name+'</div>'
            +'<div style="font-size:12px;color:#888;margin-bottom:10px">'+item.colorName+' · Size: '+item.size+'</div>'
            +'<div style="display:flex;align-items:center;justify-content:space-between">'
            +'<div style="display:flex;align-items:center;border:1.5px solid #e5e5e5;border-radius:8px;overflow:hidden">'
            +'<button class="cq-btn" data-id="'+item.id+'" data-size="'+item.size+'" data-dir="-1" style="width:32px;height:32px;background:none;border:none;cursor:pointer;font-size:18px;color:#333;display:flex;align-items:center;justify-content:center">-</button>'
            +'<span style="width:32px;text-align:center;font-size:14px;font-weight:600">'+item.qty+'</span>'
            +'<button class="cq-btn" data-id="'+item.id+'" data-size="'+item.size+'" data-dir="1" style="width:32px;height:32px;background:none;border:none;cursor:pointer;font-size:18px;color:#333;display:flex;align-items:center;justify-content:center">+</button>'
            +'</div>'
            +'<button class="cr-btn" data-id="'+item.id+'" data-size="'+item.size+'" style="background:none;border:none;cursor:pointer;color:#e53e3e;font-size:12px;font-weight:600">Remove</button>'
            +'</div></div>'
            +'<div style="font-size:15px;font-weight:700;flex-shrink:0;color:#0A0A0A">LKR '+(item.price*item.qty).toLocaleString()+'</div>'
            +'</div>';
        }).join('')
    )
    +'</div>'
    +(items.length>0
      ? '<div style="padding:18px 22px;border-top:1px solid #eee;flex-shrink:0">'
        +'<div style="margin-bottom:16px">'
        +'<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:#666"><span>Subtotal</span><span>LKR '+sub.toLocaleString()+'</span></div>'
        +'<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px;color:#666"><span>Shipping</span><span>'+(ship===0?'<span style="color:#22c55e;font-weight:700">FREE</span>':'LKR '+ship.toLocaleString())+'</span></div>'
        +'<div style="display:flex;justify-content:space-between;font-size:17px;font-weight:700;padding-top:12px;border-top:1px solid #eee"><span>Total</span><span>LKR '+(sub+ship).toLocaleString()+'</span></div>'
        +'</div>'
        +'<button id="checkout-cart-btn" class="ba-btn ba-btn-k ba-btn-full" style="font-size:15px;padding:15px;margin-bottom:10px">Checkout &mdash; LKR '+(sub+ship).toLocaleString()+'</button>'
        +'<button id="continue-shop-btn" class="ba-btn ba-btn-ou ba-btn-full">Continue Shopping</button>'
        +'</div>'
      : '')
    ;

  document.body.appendChild(overlay);
  document.body.appendChild(sidebar);
  document.body.style.overflow='hidden';

  document.getElementById('close-cart-btn').addEventListener('click',closeCart);
  overlay.addEventListener('click',closeCart);
  var csb=document.getElementById('continue-shop-btn'); if(csb) csb.addEventListener('click',closeCart);
  var ccb=document.getElementById('checkout-cart-btn'); if(ccb) ccb.addEventListener('click',function(){closeCart();navTo('checkout');});

  sidebar.querySelectorAll('.cq-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      var pid=parseInt(this.dataset.id),sz=this.dataset.size,dir=parseInt(this.dataset.dir);
      var cart=State.cart;
      var item=cart.find(function(x){return x.id===pid&&x.size===sz;});
      if(!item)return;
      item.qty=Math.max(1,item.qty+dir);
      State.cart=cart;
      closeCart(); setTimeout(openCart,80);
    });
  });
  sidebar.querySelectorAll('.cr-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      var pid=parseInt(this.dataset.id),sz=this.dataset.size;
      State.cart=State.cart.filter(function(x){return!(x.id===pid&&x.size===sz);});
      toast('Removed from bag');
      closeCart(); if(State.cart.length) setTimeout(openCart,80);
    });
  });
}
window.openCart = openCart;



function loadAdminOrdersWithFirestore(cb){ if(DB&&ADMIN_LOGGED){ DB.collection('orders').orderBy('date','desc').limit(200).get().then(function(snap){ cb(snap.docs.map(function(d){return d.data();})); }).catch(function(){ cb(State.orders); }); } else cb(State.orders); }

</script>
</body>
